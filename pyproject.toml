[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "escaner-web"
version = "0.1.0"
description = "Escáner de seguridad web con IA: cabeceras, cookies, TLS, rutas sensibles, contenido y CVE, con nota A-F e informe explicativo."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arturo Igor Diez Cardenas" }]
dependencies = [
    "requests>=2.32",
    "cryptography>=43",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
pdf-windows = ["xhtml2pdf>=0.2.16"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
escaner = "escaner.cli:app"

[tool.setuptools.packages.find]
include = ["escaner*"]

[tool.setuptools.package-data]
escaner = ["reporting/templates/*", "rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["escaner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Typer declara las opciones como valores por defecto: es su forma documentada.
"escaner/cli.py" = ["B008"]

[tool.bandit]
exclude_dirs = ["tests", "lab"]
