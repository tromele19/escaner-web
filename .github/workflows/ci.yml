name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Ruff (análisis estático)
        run: ruff check .
      - name: Bandit (seguridad del código)
        run: bandit -q -r escaner -c pyproject.toml
      - name: Pytest con cobertura
        run: pytest --cov=escaner --cov-report=term-missing
      - name: pip-audit (dependencias)
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: pip-audit --skip-editable
