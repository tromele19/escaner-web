# Laboratorio del escáner de seguridad web.
# TODOS los sitios escuchan SOLO en 127.0.0.1: no son accesibles desde la red,
# aunque la VM tenga un adaptador puente. Además se deniega cualquier otro origen.
# Las rutas __LAB__ las sustituye setup.sh por la carpeta real del laboratorio.

# ---------------------------------------------------------------- correcto.lab
# Configuración correcta: debería sacar A.
server {
    listen 127.0.0.1:80;
    server_name correcto.lab;
    allow 127.0.0.1; deny all;
    return 301 https://correcto.lab$request_uri;
}
server {
    listen 127.0.0.1:443 ssl;
    server_name correcto.lab;
    allow 127.0.0.1; deny all;
    ssl_certificate     __LAB__/certs/sitios.crt;
    ssl_certificate_key __LAB__/certs/sitios.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/escaner-lab/correcto;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Set-Cookie "__Host-session=lab123; Path=/; Secure; HttpOnly; SameSite=Lax" always;
}

# ---------------------------------------------------------------- inseguro.lab
# Sin cabeceras de seguridad, cookie de sesión sin atributos, versiones
# anunciadas y HTTP que no redirige a HTTPS.
server {
    listen 127.0.0.1:80;
    listen 127.0.0.1:443 ssl;
    server_name inseguro.lab;
    allow 127.0.0.1; deny all;
    ssl_certificate     __LAB__/certs/sitios.crt;
    ssl_certificate_key __LAB__/certs/sitios.key;
    server_tokens on;
    root /var/www/escaner-lab/inseguro;

    add_header X-Powered-By "PHP/7.4.3" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Set-Cookie "PHPSESSID=abc123; Path=/" always;
}

# ---------------------------------------------------------------- expuesto.lab
# Ficheros sensibles sembrados (.env, .git/, copias de seguridad, panel).
server {
    listen 127.0.0.1:80;
    server_name expuesto.lab;
    allow 127.0.0.1; deny all;
    return 301 https://expuesto.lab$request_uri;
}
server {
    listen 127.0.0.1:443 ssl;
    server_name expuesto.lab;
    allow 127.0.0.1; deny all;
    ssl_certificate     __LAB__/certs/sitios.crt;
    ssl_certificate_key __LAB__/certs/sitios.key;
    server_tokens off;
    root /var/www/escaner-lab/expuesto;
    autoindex on;  # listado de directorios activado (mala práctica a propósito)

    add_header Strict-Transport-Security "max-age=63072000" always;
}

